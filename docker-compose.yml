name: auth_system
services:
  prod-api:
    build:
      context: .
      target: production
    container_name: prod_api
    command: >
      sh -c "pnpm prisma migrate deploy &&
             pnpm prisma db seed &&
             pnpm start:prod"
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    depends_on:
      prod-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prod_infra_net
  prod-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: prod_db
    command: >
      postgres -c shared_preload_libraries=pg_cron
               -c cron.database_name=${POSTGRES_DB}
    ports:
      - '5432:5432'
    env_file:
      - .env.production
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prod_infra_net
  prod-redis:
    image: redis:7-alpine
    container_name: prod_redis
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    restart: unless-stopped
    networks:
      - prod_infra_net
volumes:
  prod_db_data:
  prod_redis_data:
networks:
  prod_infra_net:
    driver: bridge
