name: auth_system
services:
  dev-api:
    build:
      context: .
      target: development
    container_name: dev_api
    command: >
      sh -c "pnpm install --frozen-lockfile && 
             pnpm prisma migrate deploy &&
             pnpm prisma db seed &&
             pnpm start:dev"
    ports:
      - '3001:3000'
    env_file:
      - .env.development
    depends_on:
      dev-db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./generated:/app/generated
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - dev_node_modules:/app/node_modules # Prevents local node_modules from overwriting container's
    networks:
      - dev_infra_net
  dev-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: dev_db
    command: >
      postgres -c shared_preload_libraries=pg_cron
               -c cron.database_name=auth_system
    ports:
      - '5431:5432'
    env_file:
      - .env.development
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev_infra_net
  dev-redis:
    image: redis:7-alpine
    container_name: dev_redis
    command: redis-server --appendonly yes
    volumes:
      - dev_redis_data:/data
    ports:
      - '6371:6379'
    networks:
      - dev_infra_net
volumes:
  dev_db_data:
  dev_redis_data:
  dev_node_modules:
networks:
  dev_infra_net:
    driver: bridge
